[package]
name = "espforge-emit"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
espforge-model = { workspace = true }
espforge-options = { workspace = true }
espforge-espgenerate-template = { workspace = true }
# Same pin/feature as the other crates, so only one copy is compiled.
esp-metadata-generated = { version = "0.5.3", features = ["build-script"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
# The Rust backend (increment 2) and the semantic comparator the golden parse
# sweep uses (`codegen::equiv`).
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.3"
toml = "1"

[dev-dependencies]
tempfile = "3"
espforge_examples = { workspace = true }
