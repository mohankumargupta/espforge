[package]
name = "espforge-emit"
version = "0.1.0"
edition = "2024"

[dependencies]
espforge-model = { path = "../espforge-model" }
espforge-options = { path = "../espforge-options" }
espforge-espgenerate-template = { path = "../espforge-espgenerate-template" }
# Same pin/feature as the other crates, so only one copy is compiled.
esp-metadata-generated = { version = "0.5.3", features = ["build-script"] }
include_dir = "0.7.4"
# `loader` provides Environment::add_template_owned.
minijinja = { version = "2", features = ["loader"] }
anyhow = "1"
serde_json = "1"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
espforge_examples = { path = "../espforge-examples" }
