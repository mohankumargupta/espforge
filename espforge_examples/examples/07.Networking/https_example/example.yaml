espforge:
  name: https_example
  platform: esp32c3
  runtime: embassy
  alloc: true

esp32:
  # Explicit heap configuration required for TLS buffers
  heap:
    size: 66320 # 72KB - enough for stack + TLS overhead
  wifi:
    ssid: Wokwi-GUEST
    password: ""
    auth: open

components:
  https:
    using: HttpsClient
    with: {}



