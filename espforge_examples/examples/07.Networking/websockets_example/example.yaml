espforge:
  name: wifi_example
  platform: esp32c3
  runtime: embassy
  alloc: true

esp32:
  # Explicit heap configuration required for TLS buffers
  heap:
    size: 73728 # 72KB - enough for stack + TLS overhead
  wifi:
    ssid: Wokwi-GUEST
    password: ""
    auth: open

components:
  ws_client:
    using: WebSocketClient
    with:
      uri: "ws://echo.websocket.org"

