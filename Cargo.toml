[workspace]
resolver = "3"
members = [
    "espf",
    "espforge",
    "espforge-core",
    "espforge-diagnostics",
    "espforge-drivers",
    "espforge-elements",
    "espforge-emit",
    "espforge-examples",
    "espforge-runtime",
    "espforge-schema",
]
exclude = ["legacy"]

[workspace.package]
version = "0.7.6"
edition = "2024"
license = "MIT"
description = "a scaffolding++ tool for creating esp32 no_std esphal without the hassle"
repository = "https://github.com/mohankumargupta/espforge"
homepage = "https://github.com/mohankumargupta/espforge"
documentation = "https://github.com/mohankumargupta/espforge"
keywords = ["esp32", "embedded", "hal", "framework", "esphome"]
categories = ["embedded", "hardware-support", "no-std"]

[workspace.dependencies]
winnow = { version = "0.7", features = ["simd"] }
annotate-snippets = "0.12"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
kdl = "6"
toml_edit = "=0.22.27"
syn = { version = "=3.0.8", features = ["full"] }
quote = "=1.0.47"
proc-macro2 = "=1.0.107"
prettyplease = "=0.3.0"
toml = "=1.1.8"
clap = { version = "4", features = ["derive"] }
cliclack = "0.5.7"
include_dir = { version = "0.7.4", features = ["glob"] }
esp-metadata-generated = { version = "0.5.3", features = ["build-script"] }
tempfile = "3"
linkme = "0.3.37"

# Workspace crates, so members declare them with `{ workspace = true }`
# instead of repeating a relative path.
espf = { path = "espf", version = "0.7.6" }
espforge-core = { path = "espforge-core", version = "0.7.6" }
espforge-diagnostics = { path = "espforge-diagnostics", version = "0.7.6" }
espforge-drivers = { path = "espforge-drivers", version = "0.7.6" }
espforge-elements = { path = "espforge-elements", version = "0.7.6" }
espforge-emit = { path = "espforge-emit", version = "0.7.6" }
# The package keeps its underscore name, so the dependency key matches it.
espforge_examples = { path = "espforge-examples", version = "0.7.6" }
espforge-runtime = { path = "espforge-runtime", version = "0.7.6" }
espforge-schema = { path = "espforge-schema", version = "0.7.6" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
