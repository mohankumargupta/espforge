[workspace]
resolver = "3"
members = ["espf", "espforge", "espforge-core", "espforge-bindings", "espforge-diagnostics", "espforge-emit", "espforge-examples", "espforge-hardware", "espforge-model", "espforge-options", "espforge-runtime", "espforge-espgenerate-template"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mohankumargupta/espforge"
homepage = "https://github.com/mohankumargupta/espforge"
documentation = "https://github.com/mohankumargupta/espforge"
keywords = ["esp32", "embedded", "hal", "framework", "esphome"]
categories = ["embedded", "hardware-support", "no-std"]

[workspace.dependencies]
# Use the same versions your current prototype already builds with.
winnow = { version = "0.7", features = ["simd"] }
annotate-snippets = "0.12"
serde_json = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
