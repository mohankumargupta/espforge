[package]
name = "espforge-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
esp-hal = {version="1", features = ["unstable"]}
embedded-hal = "*"
embedded-io = "*"
log = "0.4"

# Optional external driver crates, pulled only by the matching feature
# (design §19.1/§19.3). A generated project enables these transitively via the
# `espforge-runtime` feature list in its manifest; the crate re-exports what the
# app needs under `#[cfg(feature = "...")]`.
# Optional external driver crates, pulled only by the matching feature
# (design §19.1/§19.3). A generated project enables these transitively via the
# `espforge-runtime` feature list in its manifest; the crate re-exports what the
# app needs under `#[cfg(feature = "...")]`. These are the same crates v1 used
# (espforge_devices/Cargo.toml).
ssd1306 = { version = "*", optional = true }
display-interface-i2c = { version = "0.5.0", optional = true }
embedded-graphics = { version = "*", optional = true }
ili9341 = { version = "0.6.0", optional = true }
display-interface-spi = { version = "0.5.0", optional = true }

# Network software-services (ADR-012). `edge-http` is the HTTP protocol layer;
# `edge-nal-embassy` provides the `edge_nal::TcpConnect + Dns` impl for
# `&embassy_net::Stack`; `embassy-net` is the generated project's network stack.
embassy-net = { version = "0.9", optional = true }
edge-http = { version = "0.8", optional = true }
edge-nal = { version = "0.7", optional = true }
edge-nal-embassy = { version = "0.9", optional = true }

[features]
# Each capability module is its own feature, gated in `mod.rs` and named after
# the module's folder/stem (design §19.1/§19.4). Adding a driver = one line here
# plus one cfg-gated `pub mod` line.
led = []
i2c = []
button = []
spi = []
uart = []
http = ["dep:embassy-net", "dep:edge-http", "dep:edge-nal", "dep:edge-nal-embassy"]
ssd1306 = ["dep:ssd1306", "dep:display-interface-i2c", "dep:embedded-graphics"]
ili9341 = ["dep:ili9341", "dep:display-interface-spi", "dep:embedded-graphics"]

