[workspace]
resolver = "2"
members = [
    "espforge-model",
    "espforge",
    "espforge-bindings",
    "espforge-runtime",
    "espforge-examples",
]
# `espforge-runtime` is target-only (depends on esp-hal); it builds only under
# an esp target (e.g. via a generated project). Default host build skips it so
# `cargo build` stays green without an embedded toolchain.
default-members = [
    "espforge-model",
    "espforge",
    "espforge-bindings",
    "espforge-examples",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
include_dir = "0.7"
embedded-hal = "1.0"
minijinja = { git = "https://github.com/mitsuhiko/minijinja", rev = "ef27bc9ea4a8762a1fddaeaf2302d744a57bc1d2", features = ["json"] }
