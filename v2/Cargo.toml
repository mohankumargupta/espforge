[workspace]
resolver = "2"
members = [
    "espforge-model",
    "espforge",
    "espforge-bindings",
    "espforge-runtime",
    "espforge-examples",
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
embedded-hal = "1.0"
