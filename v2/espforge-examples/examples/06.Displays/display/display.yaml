espforge:
  name: display
  target: esp32c3
  runtime: embassy

esp32:
  gpio:
    gpio16: { pin: 16, direction: output }
    gpio5: { pin: 5, direction: output }
  i2c:
    i2c0: { i2c: 0, sda: 21, scl: 22, frequency_kHz: 400 }

components:
  - id: i2c_bus
    using: i2c
    with:
      bus: $i2c0

devices:
  - id: screen
    using: ssd1306
    with:
      bus: $i2c_bus
      reset: $gpio16
      dc: $gpio5
