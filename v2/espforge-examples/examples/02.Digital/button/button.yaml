espforge:
  name: button
  platform: esp32c3

esp32:
  gpio:
    gpio7: { pin: 7, direction: output }
    gpio9: { pin: 9, direction: input  }

components:
  red_led:
    using: led
    with:
      pin: $gpio7
      active_low: false

  button:
    using: button
    with:
      pin: $gpio9
      pull_up: true

devices: {}
