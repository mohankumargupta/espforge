# Async button example (embassy runtime).
#
# A button task waits (edge-triggered, no polling) for the button to be pressed
# and signals a cross-task `Signal`. The `forever` task waits on that signal and
# toggles an LED each time the button is pressed.
#
# Wiring mirrors the blocking `button` example:
#   - `gpio7`  output  -> `red_led`   (LED indicator)
#   - `gpio9`  input   -> `button`    (pull-up button)
#
# `runtime: embassy` selects the async `Delay` and enables the `signal` feature
# (which pulls in `embassy_sync`), so `crate::signal!` is available.
espforge:
  name: button_async
  target: esp32c3
  runtime: embassy

esp32:
  gpio:
    gpio7: { pin: 7, direction: output }
    gpio9: { pin: 9, direction: input }

components:
  red_led:
    using: led
    with:
      pin: $gpio7
      active_low: false
  button:
    using: button
    with:
      pin: $gpio9
      pull_up: true

devices: []
