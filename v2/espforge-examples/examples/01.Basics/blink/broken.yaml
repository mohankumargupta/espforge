espforge:
  name: broken
  target: esp32c3
  runtime: blocking

esp32:
  gpio:
    gpio_a: { pin: 18, direction: output }
    gpio_b: { pin: 18, direction: output }
    ghost_gpio: { pin: 19, direction: output }

components:
  - id: led
    using: led
    with:
      pin: $gpio_a
  - id: led
    using: led
    with:
      pin: $gpio_b
  - id: red_led
    using: led
    with:
      pin: $gpio_a
  - id: green_led
    using: led
    with:
      pin: $gpio_b
  - id: mystery
    using: nope
    with:
      pin: $gpio_a
  - id: orphan
    using: led
    with: {}
  - id: ghost
    using: led
    with:
      pin: $missing_gpio

devices: []
