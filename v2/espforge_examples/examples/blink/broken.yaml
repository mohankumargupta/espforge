espforge:
  name: broken
  target: esp32c3
  runtime: blocking

esp32:
  gpio:
    gpio_a: { pin: 18, direction: output }
    gpio_b: { pin: 18, direction: output }
    ghost_gpio: { pin: 19, direction: output }

components:
  # Duplicate instance name -> duplicate instance name diagnostic.
  - id: led
    using: led
    with:
      pin: $gpio_a
  - id: led
    using: led
    with:
      pin: $gpio_b

  # Two instances share the same physical pin (GPIO18) -> double-claim.
  - id: red_led
    using: led
    with:
      pin: $gpio_a
  - id: green_led
    using: led
    with:
      pin: $gpio_b

  # Unknown driver kind -> unknown driver diagnostic.
  - id: mystery
    using: nope
    with:
      pin: $gpio_a

  # Missing required pin ref -> missing-with-key diagnostic.
  - id: orphan
    using: led
    with: {}

  # Unresolved reference -> unresolved reference diagnostic.
  - id: ghost
    using: led
    with:
      pin: $missing_gpio

devices: []
