espforge:
  name: blink
  target: esp32
  runtime: blocking

esp32:
  gpio:
    - gpio: 18
  i2c:
    - name: i2c_master
      peripheral: 0
      sda: 21
      scl: 22
      frequency: 100

components:
  - id: i2c_bus
    using: i2c
    with:
      bus: $i2c_master

devices:
  - id: status_led
    using: led
    with:
      pin: $GPIO18
      active_low: false
