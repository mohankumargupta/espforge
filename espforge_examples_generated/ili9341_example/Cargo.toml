[package]
edition      = "2024"
name         = "ili9341_example"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "ili9341_example"
path = "./src/bin/main.rs"

[dependencies.embedded-hal-bus]
version = "0.3.0"

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32c3", "log-04", "unstable"] }


esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

critical-section = "1.2.0"
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.16.1", features = ["esp32c3", "log-04"] }
espforge_platform = { version = "0.1.12", features = ["spi"] }
espforge_components = { version = "0.1.10", features = ["spi"] }
espforge_devices = { version = "0.1.12", features = ["ili9341"] }
static_cell = "2.1"
embedded-hal = "1.0.0"

[dependencies.embedded-io]
version = "0.7.1"
optional = true


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
