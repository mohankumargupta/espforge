[package]
edition      = "2024"
name         = "helloworld"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "helloworld"
path = "./src/bin/main.rs"

[dependencies.embedded-hal-bus]
version = "0.3.0"
optional = true

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c3", "log-04", "unstable"] }


esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

critical-section = "1.2.0"
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32c3", "log-04"] }
espforge_platform = { path = "C:/Users/mohan/Developer/mohankumargupta/espforge/espforge_platform" }
espforge_components = { path = "C:/Users/mohan/Developer/mohankumargupta/espforge/espforge_components" }
espforge_devices = { path = "C:/Users/mohan/Developer/mohankumargupta/espforge/espforge_devices" }
static_cell = "2.1"
embedded-hal = "1.0.0"

[dependencies.embedded-io]
version = "0.7.1"
optional = true


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
