[package]
edition      = "2024"
name         = "button_async"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "button_async"
path = "./src/bin/main.rs"

[dependencies.embedded-hal-bus]
version = "0.3.0"
optional = true

[dependencies]
esp-hal = { version = "~1.0", features = ["esp32c3", "log-04", "unstable"] }

esp-rtos = { version = "0.2.0", features = [
  "embassy",
  "esp-alloc",
  "esp32c3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.9.1", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = [
  "esp32c3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.16.1", features = ["esp32c3", "log-04"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
espforge_platform = { version = "0.1.12", features = ["embassy", "embassy"] }
espforge_components = { version = "0.1.10", features = ["embassy", "button", "led"] }
espforge_devices = { version = "0.1.12" }
embedded-hal = "1.0.0"

[dependencies.embedded-io]
version = "0.7.1"
optional = true


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
