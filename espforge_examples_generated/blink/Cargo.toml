[package]
name = "blink"
version = "0.1.0"
edition = "2021"

[dependencies]
espforge-runtime = { path = "/home/pi/junk/espforge/v2/espforge-runtime", version = "0.1.0" }
esp-hal = { version = "*", features = ["esp32c3"] }
esp-backtrace = { version = "*", features = ["esp32c3", "println", "panic-handler"] }
esp-println = { version = "*", features = ["esp32c3", "log-04"] }
static_cell = "*"


[profile.release]
debug = true

# Standalone workspace root: keeps this generated project self-contained and
# prevents cargo from walking up to a parent workspace (ADR-008 generated output).
[workspace]
