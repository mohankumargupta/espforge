espforge:
  name: mousefood_demo
  platform: esp32s3
esp32:
  psram:
    mode: quad
  spi:
    spi2:
      spi: 2
      sck: 3
      mosi: 4
      frequency_kHz: 10000
  gpio:
    pin_dc:
      pin: 6
      direction: output
    pin_rst:
      pin: 7
      direction: output
    pin_cs:
      pin: 5
      direction: output
components:
  main_spi:
    using: SpiDevice
    with:
      spi: $spi2
devices:
  display:
    using: ili9341
    with:
      spi: $main_spi
      dc: $pin_dc
      rst: $pin_rst
      cs: $pin_cs
