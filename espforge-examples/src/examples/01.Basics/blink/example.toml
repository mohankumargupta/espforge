chips    = ["esp32c3", "esp32s3"]
# `app/rust/app.rs` is blocking-style (`fn setup(ctx: &mut Context)`); the
# embassy contract is `async fn setup(ctx: &'static Context, Spawner)`, which
# `blink_async` carries. A blocking app cannot be awaited, so this example is
# blocking-only rather than advertised for a runtime it cannot compile under.
runtimes = ["blocking"]
