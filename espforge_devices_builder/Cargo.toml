[package]
name = "espforge_devices_builder"
version = "0.1.0"
edition = "2024"
description = "Component registration for espforge"
license = "MIT"
readme = "../README.md"
keywords = ["esp32", "embedded", "hal", "framework", "esphome"]
categories = ["embedded", "hardware-support", "no-std"]
repository = "https://github.com/mohankumargupta/espforge"
homepage = "https://github.com/mohankumargupta/espforge"
documentation = "https://github.com/mohankumargupta/espforge"

[dependencies]
espforge_common = { version = "0.1.1", path = "../espforge_common" }
espforge_configuration = { path = "../espforge_configuration", version = "0.1.0" }
anyhow = "1.0"
quote = "1.0"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
inventory = "0.3"
syn = "2.0"

