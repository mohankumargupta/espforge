[package]
name = "espforge_devices"
version = "0.1.3"
edition = "2024"
description = "Devices for espforge"
license = "MIT"
readme = "README.md"
keywords = ["esp32", "embedded", "hal", "framework", "esphome"]
categories = ["embedded", "hardware-support", "no-std"]
repository = "https://github.com/mohankumargupta/espforge"
homepage = "https://github.com/mohankumargupta/espforge"
documentation = "https://github.com/mohankumargupta/espforge"


[dependencies]
espforge_platform = { version = "0.1.4", path = "../espforge_platform" }
ssd1306 = { version = "0.10.0", optional = true }
ili9341 = { version = "0.6.0", optional = true }
display-interface-spi = { version = "0.5.0", optional = true }
embedded-graphics = "0.8.1"
embedded-hal = "1.0.0"
display-interface-i2c = { version = "0.5.0", optional = true }

[features]
ssd1306 = ["dep:ssd1306", "dep:display-interface-i2c"]
ili9341 = ["dep:ili9341", "dep:display-interface-spi"]

[workspace]
