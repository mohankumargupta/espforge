[package]
name = "espforge"
version = "0.1.0"
edition = "2024"

[dependencies]
espforge-emit = { path = "../espforge-emit" }
espforge-options = { path = "../espforge-options" }
# Only for its VERSION constant (`espforge version`).
espforge-espgenerate-template = { path = "../espforge-espgenerate-template" }
anyhow = "1"
espf = { path = "../espf" }
espforge-bindings = { path = "../espforge-bindings" }
espforge-model = { path = "../espforge-model" }
espforge-hardware = { path = "../espforge-hardware" }
clap = { version = "4", features = ["derive"] }
# Chip metadata (supported chips, their Rust target triples) used by doctor.
esp-metadata-generated = { version = "0.5.3", features = ["build-script"] }
# Use the same versions your current prototype already builds with.
winnow = { workspace = true }
annotate-snippets = { workspace = true }
cliclack = "0.5.6"
espforge_examples = { version = "0.1.9", path = "../espforge-examples" }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cargo_metadata = "0.19"
