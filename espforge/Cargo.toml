[package]
name = "espforge"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true 
categories.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
espforge-core = { path = "../espforge-core" }
espforge-options = { path = "../espforge-options" }
# Only for its VERSION constant (`espforge version`).
espforge-espgenerate-template = { path = "../espforge-espgenerate-template" }
anyhow = "1"
espforge-diagnostics = { path = "../espforge-diagnostics" }
serde_json = { workspace = true }
espforge-model = { path = "../espforge-model" }
clap = { version = "4", features = ["derive"] }
# Chip metadata (supported chips, their Rust target triples) used by doctor.
esp-metadata-generated = { version = "0.5.3", features = ["build-script"] }
cliclack = "0.5.6"
espforge_examples = { version = "0.6.0", path = "../espforge-examples" }

[dev-dependencies]
tempfile = "3"
# `tests/codegen_equiv.rs` parses the golden trees through the comparators.
espforge-emit = { path = "../espforge-emit" }
# Only a test: the `espf` catalog must cover every driver tag.
espforge-bindings = { path = "../espforge-bindings" }

[build-dependencies]
cargo_metadata = "0.19"
