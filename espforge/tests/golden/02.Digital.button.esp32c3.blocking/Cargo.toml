[package]
name = "button"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "button"
path = "./src/bin/main.rs"

[dependencies]
espforge-runtime = { version = "0.6.0" }
static_cell = "2.1.1"
critical-section = "1.2.0"
log = "0.4.27"
esp-hal = { version = "~1.2.2", features = ["esp32c3", "unstable", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04", "esp32c3"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32c3", "uart", "log-04"] }
esp-backtrace = { version = "0.20.0", features = ["esp32c3", "panic-handler", "println"] }
esp-alloc = { version = "0.11.0", features = ["esp32c3"] }
# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1       # LLVM can perform better optimizations using a single thread
debug = 2               # prefer slower builds but better debugging experience
lto = "fat"
opt-level = "s"
