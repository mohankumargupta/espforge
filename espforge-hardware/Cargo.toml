[package]
name = "espforge-hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme.workspace = true

[dependencies]
# Lowering inputs: `ParsedNode` (espf) plus the generated attribute
# accessors -> a `Board` from `espforge-model`.
espforge-model = { path = "../espforge-model" }
espf = { path = "../espf" }
espforge-options = { path = "../espforge-options" }
espforge-bindings = { path = "../espforge-bindings" }

[dev-dependencies]
# The embedded corpus, as a data source for the lowering tests.
espforge_examples = { path = "../espforge-examples" }
