[package]
name = "espforge-diagnostics"
version = "0.1.0"
edition = "2024"

# A leaf crate: it knows how to describe and render a problem, not what ESPF is.
# Every other crate may depend on it, and it depends on none of them.
[dependencies]
annotate-snippets = { workspace = true }
serde_json = { workspace = true }
